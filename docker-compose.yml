services:
  intelligence-dashboard:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ml-unified-intelligence
    restart: unless-stopped
    # Optional: the app starts without it; only Research Post needs OPENAI_API_KEY
    env_file:
      - path: ./frontend/.env
        required: false
    environment:
      - MODEL_ROOT=/models
      - MODEL_IDLE_SECONDS=180
      - MODEL_MANAGER_VERBOSE=true
      - OPENAI_MODEL=gpt-4o-mini
      - HF_HOME=/app/.cache
      - TRANSFORMERS_CACHE=/app/.cache
    ports:
      - "8501:8501"
    volumes:
      # Persistent volume for local transformer models and adapters
      - ./models:/models
      # Hugging Face downloads survive container re-creation
      - hf-cache:/app/.cache

volumes:
  hf-cache:
