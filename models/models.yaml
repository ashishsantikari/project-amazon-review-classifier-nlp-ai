models:
  lora_finetuned:
    type: lora
    name: sentiment-lora
    keyword: sentiment-lora
    env_var: LORA_SENTIMENT_MODEL_DIR
    fallback_name: roberta-base-sentiment-lora
    task: sentiment
  roberta_finetuned:
    type: full
    name: roberta-base-sentiment-finetuned
    keyword: roberta-base-sentiment-finetuned
    env_var: ROBERTA_SENTIMENT_MODEL_DIR
    fallback_name: roberta-base-sentiment-finetuned
    task: sentiment
  roberta_reference:
    type: hub
    hub_id: cardiffnlp/twitter-roberta-base-sentiment-latest
    env_var: REFERENCE_SENTIMENT_MODEL_ID
    fallback_name: roberta_reference_model
    task: sentiment
  category:
    type: pipeline
    name: category-transformer-v1
    keyword: category
    env_var: CATEGORY_MODEL_DIR
    fallback_name: category-heuristic-v1
    task: category
